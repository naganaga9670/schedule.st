    <style>

<body>

<div class="print-btn-container">

<!-- 印刷用ページ（A4横・横5列×縦2列の10面配置） -->
<div class="print-page" id="print-page-1"></div>
<div class="print-page" id="print-page-2"></div>

<div id="status-bar" class="status-fixed-bar" aria-live="polite">
    <span id="status-message" class="status-message">確認中...</span>
    <span id="pole-message" class="pole-message"></span>
</div>

<script>
    const weekdaysLabels = ['日', '月', '火', '水', '木', '金', '土'];

    const today = new Date();
    const currentYear = today.getFullYear();
    const currentMonth = today.getMonth();
    const currentDate = today.getDate();
    const currentHour = today.getHours();

    const holidays = {
        2026: { 7: [20], 8: [11], 9: [21, 22, 23], 10: [12], 11: [3, 23], 12: [] },
        2027: { 1: [1, 11], 2: [11, 23], 3: [21, 22], 4: [29], 5: [3, 4, 5], 6: [], 7: [], 8: [] }
    };

    const specialOffDays = {
        2026: { 8: [14, 15, 16, 17], 12: [31] },
        2027: { 1: [1, 2, 3, 4, 11, 12, 18, 19, 25], 5: [3, 4, 5] }
    };

    const forcedOpenDays = {
        2026: { 8: [12, 18] },
        2027: { 1: [5] }
    };

    const longBreakLabels = {
        '2026-08-14': 'お盆休み',
        '2026-12-31': '年末年始休業',
        '2027-05-03': 'GW休業'
    };

    const poleSchedule = {
        durationSeconds: 2 * 60,
        appearancesPerHour: 3,
        minimumGapSeconds: 5 * 60,
        boundaryGapSeconds: 30,
        checkIntervalMilliseconds: 1000
    };

    const poleCelebrationMessage = '💈✨ おめでとうございます！サインポールでました！出現率10％です！ ✨💈';

    function getDaysInMonth(year, month) {
        return new Date(year, month + 1, 0).getDate();
    }

    function checkIsOff(year, monthNum, day, dayOfWeek, targetTue1, targetTue3) {
        const isForcedOpen = forcedOpenDays[year] && forcedOpenDays[year][monthNum] && forcedOpenDays[year][monthNum].includes(day);
        const isSpecialOff = specialOffDays[year] && specialOffDays[year][monthNum] && specialOffDays[year][monthNum].includes(day);

        if (isForcedOpen) return false; 
        if (isSpecialOff) return true;
        if (dayOfWeek === 1) return true;
        if (dayOfWeek === 2) {
            if (day === targetTue1 || day === targetTue3) return true;
        }
        return false;
    }

    function toDateOnly(date) {
        return new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12);
    }

    function addDays(date, days) {
        const result = toDateOnly(date);
        result.setDate(result.getDate() + days);
        return result;
    }

    function dateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function formatMonthDay(date) {
        return `${date.getMonth() + 1}月${date.getDate()}日`;
    }

    function formatMonthDayWithWeekday(date) {
        return `${formatMonthDay(date)}${weekdaysLabels[date.getDay()]}曜日`;
    }

    function createHourlyRandom(date = new Date()) {
        const seedText = [
            date.getFullYear(),
            date.getMonth() + 1,
            date.getDate(),
            date.getHours()
        ].join('-');

        let hash = 2166136261;
        for (let i = 0; i < seedText.length; i++) {
            hash ^= seedText.charCodeAt(i);
            hash = Math.imul(hash, 16777619);
        }

        let state = hash >>> 0;
        return function random() {
            state += 0x6D2B79F5;
            let value = state;
            value = Math.imul(value ^ (value >>> 15), value | 1);
            value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
            return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
        };
    }

    function getPoleVisibleIntervals(date = new Date()) {
        const random = createHourlyRandom(date);
        const count = poleSchedule.appearancesPerHour;
        const duration = poleSchedule.durationSeconds;
        const minimumGap = poleSchedule.minimumGapSeconds;
        const boundaryGap = poleSchedule.boundaryGapSeconds;
        const minimumUsedSeconds =
            (count * duration) +
            ((count - 1) * minimumGap) +
            (2 * boundaryGap);
        const extraSeconds = 3600 - minimumUsedSeconds;

        const weights = Array.from({ length: count + 1 }, () => random() + 0.01);
        const weightTotal = weights.reduce((sum, weight) => sum + weight, 0);
        const extras = weights.map(weight => Math.floor(extraSeconds * weight / weightTotal));
        extras[extras.length - 1] += extraSeconds - extras.reduce((sum, value) => sum + value, 0);

        const gaps = extras.map((extra, index) => {
            const baseGap = index === 0 || index === count ? boundaryGap : minimumGap;
            return baseGap + extra;
        });

        const intervals = [];
        let startSecond = gaps[0];
        for (let i = 0; i < count; i++) {
            intervals.push({
                startSecond,
                endSecond: startSecond + duration
            });
            startSecond += duration + gaps[i + 1];
        }

        return intervals;
    }

    function updatePoleVisibility(now = new Date()) {
        const statusBar = document.getElementById('status-bar');
        const currentSecond =
            (now.getMinutes() * 60) +
            now.getSeconds() +
            (now.getMilliseconds() / 1000);
        const visibleIntervals = getPoleVisibleIntervals(now);
        const isScheduledVisible = visibleIntervals.some(interval =>
            currentSecond >= interval.startSecond && currentSecond < interval.endSecond
        );
        const isTestVisible = window.location.hash === '#pole-test';
        const isVisible = isScheduledVisible || isTestVisible;

        if (statusBar.classList.contains('pole-visible') !== isVisible) {
            updateStatusBar(now, isVisible);
        }
    }

    function isOffDate(date) {
        const year = date.getFullYear();
        const month = date.getMonth();
        const monthNum = month + 1;
        const day = date.getDate();
        let firstMondayDate = null;
        let thirdMondayDate = null;
        let mondayCount = 0;
        const totalDays = getDaysInMonth(year, month);

        for (let d = 1; d <= totalDays; d++) {
            if (new Date(year, month, d).getDay() === 1) {
                mondayCount++;
                if (mondayCount === 1) firstMondayDate = d;
                if (mondayCount === 3) thirdMondayDate = d;
            }
        }

        return checkIsOff(
            year,
            monthNum,
            day,
            date.getDay(),
            firstMondayDate ? firstMondayDate + 1 : null,
            thirdMondayDate ? thirdMondayDate + 1 : null
        );
    }

    function findNextOpenDate(fromDate) {
        for (let i = 1; i <= 31; i++) {
            const candidate = addDays(fromDate, i);
            if (!isOffDate(candidate)) return candidate;
        }
        return null;
    }

    function findUpcomingLongBreak(fromDate) {
        const todayOnly = toDateOnly(fromDate);
        const scanStart = addDays(todayOnly, -14);
        const scanEnd = addDays(todayOnly, 30);
        let cursor = scanStart;
        const groups = [];

        while (cursor <= scanEnd) {
            if (!isOffDate(cursor)) {
                cursor = addDays(cursor, 1);
                continue;
            }

            const start = cursor;
            let end = cursor;
            while (isOffDate(addDays(end, 1))) {
                end = addDays(end, 1);
            }

            const length = Math.round((end - start) / 86400000) + 1;
            if (length >= 3) groups.push({ start, end });
            cursor = addDays(end, 1);
        }

        return groups.find(group => {
            const daysUntilStart = Math.round((group.start - todayOnly) / 86400000);
            return daysUntilStart <= 7 && todayOnly <= group.end;
        }) || null;
    }

    function buildStatusMessage(now = new Date()) {
        const messages = [];
        const todayOnly = toDateOnly(now);
        const tomorrow = addDays(todayOnly, 1);
        const todayIsOff = isOffDate(todayOnly);
        const tomorrowIsOff = isOffDate(tomorrow);
        const hour = now.getHours();
        const longBreak = findUpcomingLongBreak(todayOnly);
        const isDuringLongBreak = longBreak && todayOnly >= longBreak.start && todayOnly <= longBreak.end;
        const isCurrentlyOpen = !todayIsOff && hour >= 9 && hour < 19;
        const shouldShowNextDayNotice = todayIsOff || hour >= 17;
        const longBreakLabel = longBreak
            ? longBreakLabels[dateKey(longBreak.start)] || '長期休業'
            : null;
        const longBreakMessage = longBreak
            ? `なお、${longBreakLabel}は${formatMonthDay(longBreak.start)}から${formatMonthDay(longBreak.end)}までとなります。`
            : null;
        let longBreakAnnounced = false;

        if (hour < 19) {
            if (isDuringLongBreak) {
                messages.push(`${longBreakLabel}中のため、お休みをいただいております。`);
            } else if (todayIsOff) {
                messages.push('本日はお休みをいただいております。');
            } else if (isCurrentlyOpen) {
                messages.push('ただいま営業中です（19:00まで）。');
            } else {
                messages.push('本日は午前9時より営業開始予定です。');
            }
        } else if (!todayIsOff && hour < 22) {
            messages.push('本日の営業は終了しました。');
        }

        if (isDuringLongBreak) {
            longBreakAnnounced = true;
        }

        if (shouldShowNextDayNotice) {
            if (!tomorrowIsOff) {
                messages.push('明日は午前9時より営業開始予定です。');
            } else {
                const nextOpen = findNextOpenDate(todayOnly);
                if (!todayIsOff) {
                    messages.push('明日はお休みをいただきます。');
                }
                if (longBreak && tomorrow >= longBreak.start && tomorrow <= longBreak.end && !longBreakAnnounced) {
                    messages.push(longBreakMessage);
                    longBreakAnnounced = true;
                }
                if (nextOpen) {
                    messages.push(`次回は${formatMonthDayWithWeekday(nextOpen)}、午前9時より営業開始予定です。`);
                }
            }
        }

        if (longBreakMessage && !longBreakAnnounced) {
            messages.push(longBreakMessage);
        }

        return {
            text: messages.join('　　'),
            className: todayIsOff
                ? 'status-closed'
                : (hour >= 9 && hour < 19 ? 'status-open' : 'status-over')
        };
    }

    function restartTicker(element) {
        if (!element) return;
        const statusBar = document.getElementById('status-bar');
        const barWidth = statusBar.clientWidth;

        // display:none の要素は幅を測れないため、表示中の要素だけ再計算する。
        if (element.offsetParent === null) return;

        const messageWidth = element.scrollWidth;
        element.style.animation = 'none';
        element.style.setProperty('--scroll-start', `${barWidth}px`);
        element.style.setProperty('--scroll-end', `${-messageWidth}px`);
        void element.offsetWidth;

        const pixelsPerSecond = 90;
        const durationSeconds = Math.max(12, (barWidth + messageWidth) / pixelsPerSecond);
        element.style.animation = `status-scroll ${durationSeconds}s linear infinite`;
    }

    let pendingTickerText = null;

    function restartStatusScroll() {
        restartTicker(document.getElementById('status-message'));
    }

    function applyTickerText(text, forceNow = false) {
        const statusMessage = document.getElementById('status-message');

        if (forceNow || statusMessage.innerText === '確認中...') {
            pendingTickerText = null;
            if (statusMessage.innerText !== text) {
                statusMessage.innerText = text;
            }
            requestAnimationFrame(restartStatusScroll);
            return;
        }

        if (statusMessage.innerText !== text) {
            // 流れている途中では変更せず、次の周回開始時に切り替える。
            pendingTickerText = text;
        } else {
            pendingTickerText = null;
        }
    }

    function handleTickerIteration() {
        if (pendingTickerText === null) return;
        const statusMessage = document.getElementById('status-message');
        const nextText = pendingTickerText;
        pendingTickerText = null;
        statusMessage.innerText = nextText;
        // 文言の長さが変わるので、新しい幅で次の1周を開始する。
        requestAnimationFrame(restartStatusScroll);
    }

    function updateStatusBar(now = new Date(), poleVisible = false) {
        const status = buildStatusMessage(now);
        const statusBar = document.getElementById('status-bar');
        const nextClassName = `status-fixed-bar ${status.className}${poleVisible ? ' pole-visible' : ''}`;
        const desiredText = poleVisible
            ? `${poleCelebrationMessage}　　${status.text}`
            : status.text;

        // 背景・サインポール枠は予定時刻どおり切り替える。
        if (statusBar.className !== nextClassName) {
            statusBar.className = nextClassName;
        }

        // 本文は現在のスクロールを完走してから自然につなぐ。
        applyTickerText(desiredText);
    }

    function createMonthElement(year, month, isPrintMode = false) {
        const monthNum = month + 1;
        const monthBox = document.createElement('div');
        monthBox.className = 'month-box';

        const title = document.createElement('div');
        title.className = 'month-title';
        title.innerText = `${year}年 ${monthNum}月`;
        monthBox.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'calendar-table';

        weekdaysLabels.forEach((w, index) => {
            const wDiv = document.createElement('div');
            wDiv.className = 'weekday';
            wDiv.innerText = w;
            if (index === 0) wDiv.classList.add('col-sun');
            if (index === 6) wDiv.classList.add('col-sat');
            grid.appendChild(wDiv);
        });

        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = getDaysInMonth(year, month);

        for (let i = 0; i < firstDayIndex; i++) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'day empty';
            grid.appendChild(emptyDiv);
        }

        let firstMondayDate = null, thirdMondayDate = null, monCount = 0;
        for (let d = 1; d <= totalDays; d++) {
            if (new Date(year, month, d).getDay() === 1) {
                monCount++;
                if (monCount === 1) firstMondayDate = d;
                if (monCount === 3) thirdMondayDate = d;
            }
        }
        const targetTue1 = firstMondayDate ? firstMondayDate + 1 : null;
        const targetTue3 = thirdMondayDate ? thirdMondayDate + 1 : null;

        for (let day = 1; day <= totalDays; day++) {
            const dayOfWeek = new Date(year, month, day).getDay();
            const dayDiv = document.createElement('div');
            dayDiv.className = 'day';
            dayDiv.innerText = day;

            const isHoliday = holidays[year] && holidays[year][monthNum] && holidays[year][monthNum].includes(day);

            if (dayOfWeek === 0 || isHoliday) {
                dayDiv.classList.add('col-sun');
            } else if (dayOfWeek === 6) {
                dayDiv.classList.add('col-sat');
            }

            if (isHoliday) {
                dayDiv.classList.add('holiday-dot');
            }

            const isOff = checkIsOff(year, monthNum, day, dayOfWeek, targetTue1, targetTue3);
            if (isOff) {
                dayDiv.classList.add('off-style');
            }

            if (!isPrintMode && year === currentYear && month === currentMonth && day === currentDate) {
                dayDiv.classList.add('today-style');
            }

            grid.appendChild(dayDiv);
        }

        monthBox.appendChild(grid);
        return monthBox;
    }

    function createBaseCardElement(type, year, startMonth, monthCount) {
        const card = document.createElement('div');
        card.className = `print-card card-type-${type}`;
        
        const inner = document.createElement('div');
        inner.className = 'print-inner';

        if (type === 1) {
            const header = document.createElement('div');
            header.className = 'print-header';
            header.innerHTML = `
                <div class="header-title">理容 ながしま</div>
                <div class="header-info">
                    <div class="print-time-highlight">営業時間 9:00 〜 19:00</div>
                    <div class="print-holiday-highlight">定休日 毎週月曜・第１、第３火曜</div>
                    <div>TEL: <span class="tel-highlight">070-8516-3828</span></div>
                </div>
            `;
            inner.appendChild(header);
        }

        let y = year;
        let m = startMonth;
        for (let i = 0; i < monthCount; i++) {
            inner.appendChild(createMonthElement(y, m, true));
            m++;
            if (m > 11) {
                m = 0;
                y++;
            }
        }

        card.appendChild(inner);
        return card;
    }

    function init() {
        const mainContainer = document.getElementById('yearly-calendars');
        const printPage1 = document.getElementById('print-page-1');
        const printPage2 = document.getElementById('print-page-2');

        let startYear = currentYear;
        let startMonth = currentMonth;

        let tempYear = startYear;
        let tempMonth = startMonth;
        for (let i = 0; i < 12; i++) {
            mainContainer.appendChild(createMonthElement(tempYear, tempMonth, false));
            tempMonth++;
            if (tempMonth > 11) {
                tempMonth = 0;
                tempYear++;
            }
        }

        // ページ1（3ヶ月カレンダー名刺を10枚配置）
        for (let i = 0; i < 10; i++) {
            const card1 = createBaseCardElement(1, startYear, startMonth, 3);
            printPage1.appendChild(card1);
        }

        // ページ2（続く4ヶ月カレンダー名刺を10枚配置）
        let page2Year = startYear;
        let page2Month = startMonth + 3;
        if (page2Month > 11) {
            page2Month = page2Month - 12;
            page2Year++;
        }

        for (let i = 0; i < 10; i++) {
            const card2 = createBaseCardElement(2, page2Year, page2Month, 4);
            printPage2.appendChild(card2);
        }

        const ticker = document.getElementById('status-message');
        ticker.addEventListener('animationiteration', handleTickerIteration);

        updateStatusBar();
        updatePoleVisibility();
        window.setInterval(updatePoleVisibility, poleSchedule.checkIntervalMilliseconds);
        window.setInterval(() => {
            const now = new Date();
            const statusBar = document.getElementById('status-bar');
            updateStatusBar(now, statusBar.classList.contains('pole-visible'));
        }, 60 * 1000);
        window.addEventListener('resize', restartStatusScroll);
        window.addEventListener('hashchange', () => updatePoleVisibility());
    }
    window.onload = init;
</script>
